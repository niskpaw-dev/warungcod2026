<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10131C" />
    <meta

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WarungCOD" />

    <link

    />
    <link rel="manifest" href="#" />
    <title>WarungCOD</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/animations.css" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #080a10;
        color: #f8fafc;
      }
    </style>
  </head>
  <body class="text-slate-100">
    <div id="app" class="relative"></div>
    <div id="toast"></div>
    <div id="installPrompt" class="a2hs-card hidden p-4 slide-up">
      <div class="stacked">
        <div class="flex items-center gap-3">
          <div
            class="w-12 h-12 rounded-2xl bg-orange-500/15 flex items-center justify-center text-orange-300"
          >
            +
          </div>
          <div>
            <div class="text-sm font-semibold">Install WarungCOD</div>
            <div class="text-slate-300 text-sm">
              Add this app to your phone for instant access.
            </div>
          </div>
        </div>
        <button
          id="installButton"
          class="w-full rounded-2xl bg-gradient-to-r from-orange-500 to-rose-500 py-3 font-semibold text-white"
        >
          Add to Home Screen
        </button>
      </div>
    </div>

    <!-- App initialization -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
